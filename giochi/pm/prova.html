<html><head>
    <script type="module" src="battle.js"></script>
    <link rel="stylesheet" href="myCss.css">
</head>

<body>
    <div id="content">
        <div style="
        width: 100%;
        height: 75%;">
            <div class="half-container">
                <div class="description-box">
                    <div class="half-container description-name">
                        <div id="enemyName">pikachu</div>
                    </div>
                    <div class="half-container" style="align-items: baseline;">
                        <div class="hp-bar">
                            <div class="hp-fill" id="enemyHP" style="--start-width: 35%; --end-width: 35%; background-color: gold; width: 35%;"></div>
                        </div>
                        <div id="enemyPokemonCount"  style="width:100%;display: ruby;"></div>
                    </div>
                </div>
                <div id="enemyImg" style="
                width: 45%;
                height: 100%;">
                </div>
            </div>
            <div class="half-container">
                <div id="currentImg" style="
                width: 45%;
                height: 100%;"></div>
                <div class="description-box">
                    <div class="half-container description-name">
                        <div id="currentName">pilpup</div>
                    </div>
                    <div class="half-container" style="align-items: baseline;">
                        <div class="hp-bar">
                            <div class="hp-fill" id="currentHP" style="--start-width: 45%; --end-width: 45%; background-color: gold; width: 45%;"></div>
                        </div>
                        <div id="playerPokemonCount" style="width:100%;display: ruby;"></div>
                    </div>
                </div>
            </div>
        </div>
    
        <div class="dialog-box-background">
            <div class="dialog-box-border">
                <div id="dialog-box" class="text-container">select a move</div>
            </div>
        </div>
    </div>
    <div id="choice-bar">
        <div id="choice1" class="choice text-container" onclick="select('Fight')"> Fight </div>
        <div id="choice2" class="choice text-container" onclick="select('Bag')"> Bag </div>
        <div id="choice3" class="choice text-container" onclick="select('Pokemon')"> Pokemon</div>
        <div id="choice4" class="choice text-container" onclick="select('Cancel')"> Cancel </div>
    </div>

</body>
</html>
