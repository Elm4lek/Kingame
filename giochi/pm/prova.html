<html>
<head>
    <script type="module" src="battle.js"></script>
    <link rel="stylesheet" href="myCss.css">
</head>

<body>
    <div id="content">
        <div style="
        width: 100%;
        height: 75%;">
            <div class="half-container">
                <div class="description-box">
                    <div class="half-container" style="
                    align-items: baseline;
                    justify-content: flex-start;
                    padding-top: 20px;
                    padding-left: 20px;
                    ">
                        <div id="enemyName"></div>
                    </div>
                    <div class="half-container" style="
                    align-items: baseline;
                    ">
                        <progress id="enemyHP" value="100" max="100" style="
                        width: 90%;
                        height: 30%;
                        border: 5px solid darkslategrey;
                        border-radius: 10px;
                        background-color: darkslategrey;
                        "></progress>
                    </div>
                </div>
                <div id="enemyImg" style="
                width: 45%;
                height: 100%;">
                </div>
            </div>
            <div class="half-container">
                <div id="currentImg" style="
                width: 45%;
                height: 100%;"></div>
                <div class="description-box">
                    <div class="half-container" style="
                    align-items: baseline;
                    justify-content: flex-start;
                    padding-top: 20px;
                    padding-left: 20px;
                    ">
                        <div id="currentName"style="
                        ">piplup</div>
                    </div>
                    <div class="half-container" style="
                    align-items: baseline;
                    ">
                        <progress id="currentHP" value="100" max="100" style="
                        width: 90%;
                        height: 30%;
                        border: 5px solid darkslategrey;
                        border-radius: 10px;
                        background-color: darkslategrey;
                        "></progress>
                    </div>
                </div>
            </div>
        </div>
    
        <div class="dialog-box-background">
            <div class="dialog-box-border">
                <div id="dialog-box" class="text-container"></div>
            </div>
        </div>
    </div>
    <div id="choice-bar">
        <div id="choice1" class="choice text-container" onclick="select('Fight')"> Fight </div>
        <div id="choice2" class="choice text-container" onclick="select('Bag')"> Bag </div>
        <div id="choice3" class="choice text-container" onclick="select('Pokemon')"> Pokemon</div>
        <div id="choice4" class="choice text-container" onclick="select('Cancel')"> Cancel </div>
    </div>

</body>
</html>
